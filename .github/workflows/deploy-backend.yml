name: Deploy backend

# Fires on any push to main that touches something other than apps/web —
# apps/web deploys separately via Vercel (see DEPLOY.md), so it's excluded
# here to avoid rebuilding/restarting the whole backend stack for a
# frontend-only change.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/web/**"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/flowly
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
