services:
  kafka:
    image: apache/kafka:latest
    container_name: flowly-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Default JVM heap on this image is much larger than mem_limit below
      # allows — override explicitly or the JVM gets OOM-killed on boot.
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms400m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    cpus: 0.50
    mem_limit: 700m
    mem_reservation: 300m

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flowly-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      - kafka
    cpus: 0.20
    mem_limit: 400m
    mem_reservation: 150m

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: api
    container_name: flowly-api
    env_file:
      - apps/api/.env
    environment:
      PORT: 5001
      HOOK_URL: http://hook:3002
      KAFKA_BROKERS: kafka:29092
      NODE_OPTIONS: "--max-old-space-size=128"
    ports:
      - "5002:5001"
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.20
    mem_limit: 200m
    mem_reservation: 100m

  hook:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: hook
    container_name: flowly-hook
    env_file:
      - apps/hook/.env
    environment:
      PORT: 3002
      NODE_OPTIONS: "--max-old-space-size=128"
    ports:
      - "3002:3002"
    cpus: 0.20
    mem_limit: 200m
    mem_reservation: 100m

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: worker
    container_name: flowly-worker
    env_file:
      - apps/worker/.env
    environment:
      KAFKA_BROKERS: kafka:29092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.20
    mem_limit: 200m
    mem_reservation: 100m

  sweeper:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APP: sweeper
    container_name: flowly-sweeper
    env_file:
      - apps/sweeper/.env
    environment:
      KAFKA_BROKERS: kafka:29092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      kafka:
        condition: service_healthy
    cpus: 0.20
    mem_limit: 200m
    mem_reservation: 100m

volumes:
  kafka_data:
